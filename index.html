<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rubik 7 Chặng</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Be+Vietnam+Pro:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  /* Bố cục: mỗi màn hình là một tấm nhựa đen của khối rubik, các phần giao diện là những ô dán màu trên đó */
  --bg: #eceff4;
  --surface: #ffffff;
  --ink: #12141a;
  --muted: #586074;
  --line: #d3d8e2;
  --board: #12141a;
  --accent: #1f5fd6;
  --accent-ink: #ffffff;
  --glow: #ffffff;
  --c-white: #f6f6f1;
  --c-yellow: #ffd21a;
  --c-green: #16a34a;
  --c-blue: #2563eb;
  --c-orange: #ff7a1a;
  --c-red: #dc2626;
  --c-lock: #2b2f39;
  --arrow: #ff2d95;
  --ok: #15803d;
  --font-display: 'Baloo 2', 'Be Vietnam Pro', system-ui, sans-serif;
  --font-body: 'Be Vietnam Pro', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d0f14; --surface: #181b23; --ink: #f0f2f7; --muted: #9aa3b6; --line: #2a2f3b;
    --board: #000000; --accent: #6d9bff; --accent-ink: #0d0f14; --glow: #262b38; --ok: #4ade80; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0d0f14; --surface: #181b23; --ink: #f0f2f7; --muted: #9aa3b6; --line: #2a2f3b;
  --board: #000000; --accent: #6d9bff; --accent-ink: #0d0f14; --glow: #262b38; --ok: #4ade80; color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 16px; line-height: 1.5; -webkit-text-size-adjust: 100%; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, [tabindex]:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
h1, h2, h3 { font-family: var(--font-display); text-wrap: balance; margin: 0; line-height: 1.1; }
p { margin: 0; }
[hidden] { display: none !important; }

/* ---------- bảng chặng ---------- */
#home { max-width: 560px; margin: 0 auto; padding: 28px 16px 40px; display: flex; flex-direction: column; gap: 22px; }
.masthead { display: flex; flex-direction: column; gap: 6px; }
.masthead h1 { font-size: clamp(44px, 13vw, 64px); font-weight: 800; letter-spacing: -0.02em; }
.masthead h1 span { display: inline-block; background: var(--c-yellow); color: #12141a; padding: 0 12px 2px; border-radius: 12px; transform: rotate(-2deg); }
.lede { color: var(--muted); max-width: 34ch; }

/* nút Học tiếp: lúc nào cũng chỉ có một việc cần làm tiếp */
.next { width: 100%; border: 0; border-radius: 18px; padding: 14px 16px; background: var(--accent); color: var(--accent-ink); display: flex; align-items: center; gap: 12px; text-align: left; box-shadow: 0 12px 26px -14px var(--accent); transition: transform .12s ease; }
.next:active { transform: scale(.98); }
.next .nx { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px; }
.next .nk { font-size: 13px; font-weight: 600; opacity: .85; }
.next b { font-family: var(--font-display); font-size: 23px; font-weight: 700; line-height: 1.15; }
.next .ns { font-size: 14px; }
.next .go { font-family: var(--font-display); font-size: 34px; font-weight: 800; line-height: 1; }
/* bản đồ: 7 chặng xếp theo 3 tầng, mỗi chặng một ô dán trên tấm nhựa đen */
.board { background: var(--board); border-radius: 26px; padding: 14px 10px 10px; display: flex; flex-direction: column; gap: 7px; box-shadow: 0 18px 40px -18px rgba(0, 0, 0, .55); }
.maphead { color: #f0f2f7; padding: 0 6px 4px; display: flex; flex-direction: column; gap: 4px; }
.maphead h2 { font-size: 22px; font-weight: 700; }
.maphead p { font-size: 13.5px; line-height: 1.4; color: #aab2c5; }
.layer { display: flex; align-items: center; gap: 8px; padding: 7px 6px 0; color: #c9cfdd; font-size: 12px; font-weight: 700; letter-spacing: .07em; text-transform: uppercase; }
.layer small { font-size: 12px; font-weight: 500; letter-spacing: 0; text-transform: none; color: #8d95a8; }
.lay { display: inline-flex; flex-direction: column; gap: 2px; flex: 0 0 auto; }
.lay i { display: block; width: 18px; height: 5px; border-radius: 2px; background: #3a4050; }
.lay i.on { background: var(--c-yellow); }
.coach .lay i { background: var(--line); }
.coach .lay i.on { background: var(--c-orange); }
.sub.row { display: flex; align-items: center; gap: 7px; }
.tile { border: 0; border-radius: 14px; padding: 7px 10px 7px 8px; min-height: 62px; display: flex; align-items: center; gap: 9px; text-align: left; background: var(--c-white); color: #12141a; min-width: 0; transition: transform .12s ease; }
.tile:active { transform: scale(.98); }
.tile .num { flex: 0 0 30px; text-align: center; font-family: var(--font-display); font-weight: 800; font-size: 30px; line-height: 1; }
.tile .thumb { background: rgba(18, 20, 26, .1); border-radius: 9px; }
.tile .tx { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px; }
.tile .nm { font-family: var(--font-display); font-size: 18px; font-weight: 700; line-height: 1.15; }
.tile .one { font-size: 12.5px; line-height: 1.3; opacity: .82; }
.tile .meta { flex: 0 0 auto; font-size: 11.5px; font-weight: 600; display: flex; flex-direction: column; gap: 3px; align-items: flex-end; text-align: right; }
.tile .meta .d3 { display: flex; gap: 3px; }
.tile.doing { background: var(--c-yellow); }
.tile.done { background: var(--c-green); color: #fff; }
.tile.done .thumb { background: rgba(255, 255, 255, .22); }
.tile.exam { background: var(--c-blue); color: #fff; }
.tile.exam.done { background: var(--c-orange); color: #12141a; }
.tile.lock { background: var(--c-lock); color: #a4abbb; cursor: not-allowed; }
.tile.lock .thumb { background: rgba(255, 255, 255, .06); opacity: .7; }
.dot { width: 9px; height: 9px; border-radius: 3px; border: 1.5px solid currentColor; display: inline-block; }
.dot.on { background: currentColor; }

.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
.panel h2 { font-size: 22px; font-weight: 700; }
.whoname { font-family: var(--font-display); font-size: 26px; font-weight: 700; line-height: 1.1; }
.winp { flex: 1 1 150px; min-width: 0; border: 2px solid var(--line); border-radius: 12px; padding: 8px 12px; font: inherit; font-size: 16px; background: var(--bg); color: var(--ink); }
.reviews { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.rev { border: 1.5px solid var(--line); border-radius: 12px; padding: 9px 10px; background: transparent; text-align: left; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.rev b { font-family: var(--font-display); font-size: 18px; line-height: 1.1; }
.rev span { font-size: 12px; color: var(--muted); }
.rev.due { border-color: var(--c-orange); background: color-mix(in srgb, var(--c-orange) 14%, transparent); }
.rev.ok { border-color: var(--c-green); }
.rev.ok span { color: var(--c-green); font-weight: 600; }
.rev:disabled { cursor: default; opacity: .75; }
.steps3 { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 8px; }
.steps3 li { display: grid; grid-template-columns: 104px 1fr; gap: 10px; align-items: baseline; font-size: 15px; }
.steps3 b { font-family: var(--font-display); font-size: 18px; }
.fold { display: block; }
.fold > summary { cursor: pointer; list-style: none; display: flex; align-items: center; justify-content: space-between; gap: 10px; font-family: var(--font-display); font-size: 19px; font-weight: 700; line-height: 1.2; }
.fold > summary::-webkit-details-marker { display: none; }
.fold > summary::after { content: "＋"; color: var(--muted); font-weight: 600; }
.fold[open] > summary::after { content: "－"; }
.foldbody { display: flex; flex-direction: column; gap: 12px; margin-top: 12px; }
.hometoast { position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%); z-index: 5; background: var(--ink); color: var(--bg); padding: 8px 16px; border-radius: 16px; font-size: 14px; font-weight: 600; width: max-content; max-width: min(92vw, 420px); text-align: center; }
.hometoast:empty { display: none; }
.tip { color: var(--muted); font-size: 14px; }
.foot { display: flex; flex-wrap: wrap; gap: 8px 16px; }
.link { background: none; border: 0; padding: 4px 0; color: var(--muted); font-size: 13px; text-decoration: underline; text-underline-offset: 3px; }

.btn { border: 2px solid var(--ink); background: var(--surface); border-radius: 12px; padding: 9px 14px; font-weight: 600; font-size: 15px; line-height: 1.2; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.quiet { border-color: var(--line); color: var(--muted); }
.btn:disabled { opacity: .45; cursor: default; }
.btns { display: flex; flex-wrap: wrap; gap: 8px; }

/* ---------- màn hình học ---------- */
#play { height: 100%; min-height: 560px; display: flex; flex-direction: column; max-width: 1080px; margin: 0 auto; }
.bar { display: flex; align-items: center; gap: 10px; padding: 10px 16px 6px; }
.back { border: 0; background: none; padding: 6px 8px 6px 0; font-weight: 600; color: var(--muted); white-space: nowrap; }
.ttl { flex: 1; min-width: 0; font-family: var(--font-display); font-weight: 700; font-size: 20px; line-height: 1.1; }
.stat { display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 600; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
.tabs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 5px; padding: 0 16px 6px; }
.tabwhy { padding: 0 16px 6px; font-size: 12.5px; line-height: 1.35; color: var(--muted); }
.tab { border: 2px solid var(--line); background: transparent; border-radius: 10px; padding: 7px 2px; font-weight: 600; font-size: 13px; color: var(--muted); min-width: 0; }
.rchk { display: flex; gap: 10px; align-items: flex-start; font-size: 15px; cursor: pointer; }
.rchk input { flex: 0 0 auto; width: 22px; height: 22px; margin: 1px 0 0; accent-color: var(--ok); }
.tab[aria-selected="true"] { background: var(--ink); border-color: var(--ink); color: var(--bg); }

.work { flex: 1; min-height: 0; display: flex; flex-direction: column; }
.cubewrap { position: relative; flex: 0 0 42%; min-height: 220px; background: radial-gradient(closest-side, var(--glow), transparent 100%); }
#cv { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; cursor: grab; }
.peek { position: absolute; left: 16px; top: 4px; font-size: 11px; color: var(--muted); pointer-events: none; }
.lookbtn { position: absolute; right: 16px; bottom: 6px; border: 2px solid var(--ink); background: var(--surface); border-radius: 999px; padding: 5px 12px; font-size: 13px; font-weight: 600; }
.lookbtn.on { background: var(--arrow); border-color: var(--arrow); color: #fff; }
.toast { position: absolute; left: 50%; top: 8px; transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 7px 14px; border-radius: 16px; font-size: 13px; font-weight: 600; line-height: 1.35; opacity: 0; transition: opacity .2s; pointer-events: none; z-index: 2; width: max-content; max-width: min(92%, 420px); text-align: center; text-wrap: balance; }
.toast.on { opacity: 1; }

.side { flex: 1; min-height: 0; display: flex; flex-direction: column; }
.coach { --coachbg: var(--bg); position: relative; flex: 1; min-height: 0; overflow-y: auto; padding: 4px 16px 10px; display: flex; flex-direction: column; gap: 10px; }
.coach h3 { font-size: 20px; font-weight: 700; }
.coach .sub { font-size: 13px; color: var(--muted); font-weight: 600; }
.coach p, .coach li { max-width: 62ch; }
.how { margin: 0; padding: 0; list-style: none; counter-reset: how; display: flex; flex-direction: column; gap: 7px; font-size: 15px; }
.how li { counter-increment: how; }
.how li::before { content: "Bước " counter(how) ". "; font-weight: 700; }
.how .why { display: block; font-size: 13px; color: var(--muted); }
.ifs { margin: 0; padding-left: 18px; display: flex; flex-direction: column; gap: 5px; font-size: 14px; color: var(--muted); }
.ill { cursor: pointer; border-radius: 8px; padding: 3px 8px; margin: 0 -8px; }
.ill::after { content: " ▸"; color: var(--arrow); font-weight: 700; }
.ill:hover { background: color-mix(in srgb, var(--arrow) 8%, transparent); }
.ill.on { background: color-mix(in srgb, var(--arrow) 13%, transparent); box-shadow: inset 4px 0 0 var(--arrow); color: var(--ink); }
.fbox.ill { margin: 0; padding: 8px 10px; }
.fbox.ill::after { content: none; }
.fbox.ill b::after { content: " ▸"; color: var(--arrow); }
.gg.ill { margin: 0; padding: 2px 6px; margin-left: -6px; }
.rchk .ill { margin: 0; padding: 0 6px; }
.tap { font-size: 13px; font-weight: 600; color: var(--arrow); }
.gcard { display: flex; gap: 10px; align-items: flex-start; border: 1px solid var(--line); border-radius: 14px; padding: 8px 10px; background: var(--surface); }
.thumb { flex: 0 0 auto; border-radius: 10px; background: var(--bg); }
.gtxt { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.gg { font-size: 14px; font-weight: 600; line-height: 1.35; }
.gtask { font-size: 13px; line-height: 1.35; }
.gprog { font-size: 14px; font-weight: 600; color: var(--ok); }
.schips { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; }
.sclab { font-size: 12px; font-weight: 600; color: var(--muted); margin-right: 2px; }
.sc { border: 1.5px solid var(--line); border-radius: 8px; padding: 0 7px; font-size: 12px; font-weight: 600; color: var(--muted); }
.sc.ok { border-color: var(--ok); color: var(--ok); }
.sc.cur { border-color: var(--ink); color: var(--ink); }
.segs { margin: 0; padding: 0; list-style: none; counter-reset: seg; display: flex; flex-direction: column; gap: 6px; }
.segs li { counter-increment: seg; }
.segs li::before { content: "Bước " counter(seg) ". "; font-weight: 700; }
.segs li { border-left: 4px solid var(--line); padding: 2px 0 2px 10px; font-size: 15px; color: var(--muted); }
.segs li.cur { border-left-color: var(--arrow); color: var(--ink); font-weight: 500; }
.segs li.done { color: var(--ok); border-left-color: var(--ok); }
.segs li.done::before { content: "✓ Bước " counter(seg) ". "; }
.segs li.done { font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.segs li.cur { font-size: 17px; line-height: 1.35; }
.segs .why { display: block; font-size: 14px; font-weight: 400; color: var(--muted); margin-top: 2px; }
.segs .because, .whybox { font-size: 14px; font-weight: 400; line-height: 1.4; color: var(--ink); border-radius: 10px; padding: 6px 10px; background: color-mix(in srgb, var(--c-yellow) 20%, var(--coachbg)); border: 1.5px solid color-mix(in srgb, var(--c-yellow) 65%, transparent); }
.segs .because { display: block; margin-top: 6px; }
.because b, .whybox b { font-weight: 700; }
.because .ln, .whybox .ln { display: block; }
.because .ln + .ln, .whybox .ln + .ln { margin-top: 3px; }
.whybox b.h { display: block; font-family: var(--font-display); font-size: 16px; }
.goalline { font-size: 15px; line-height: 1.4; border-left: 4px solid var(--c-green); padding: 2px 0 2px 10px; }
.goalline b { font-weight: 700; }
.goalline.ill { margin: 0; padding: 2px 8px 2px 10px; border-radius: 0 8px 8px 0; }
.ideas { margin: 0; padding: 0; list-style: none; counter-reset: idea; display: flex; flex-direction: column; gap: 6px; font-size: 14.5px; line-height: 1.4; }
.ideas li { counter-increment: idea; display: grid; grid-template-columns: 24px 1fr; column-gap: 8px; align-items: start; }
.ideas li::before { content: counter(idea); width: 22px; height: 22px; margin-top: 1px; border-radius: 7px; background: var(--ink); color: var(--bg); font-family: var(--font-display); font-weight: 800; font-size: 14px; display: flex; align-items: center; justify-content: center; }
.ideas li.ill { margin: 0; padding: 3px 0; }
.ideas li.ill::after { content: none; }
.ideas li.ill > span::after { content: " ▸"; color: var(--arrow); font-weight: 700; }
.btns.stick { position: sticky; bottom: -10px; z-index: 1; padding: 8px 0 10px; margin-bottom: -10px; background: var(--coachbg); }
.seg2 { display: grid; grid-template-columns: 1fr 1fr; gap: 3px; padding: 3px; border-radius: 11px; background: var(--line); }
.seg2 button { border: 0; border-radius: 8px; padding: 5px 4px; font-size: 13px; font-weight: 600; background: transparent; color: var(--muted); }
.seg2 button[aria-pressed="true"] { background: var(--surface); color: var(--ink); }
.gcard.sm { padding: 6px 8px; align-items: center; }
.gcard.sm .gg { font-size: 13px; font-weight: 500; }
.lines { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 5px; font-size: 16px; line-height: 1.4; }
.lays { display: flex; flex-direction: column; gap: 6px; }
.layrow { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 5px; font-size: 13px; }
.layrow b { font-family: var(--font-display); font-size: 15px; margin-right: 2px; }
/* lời hướng dẫn là lời nói: mỗi lần một bong bóng, một ý */
.say { display: flex; gap: 8px; align-items: flex-start; }
.ava { position: relative; flex: 0 0 38px; height: 38px; margin-top: 2px; border-radius: 12px; border: 2.5px solid #12141a; background: radial-gradient(circle at 31% 42%, #12141a 0 3px, transparent 3.6px), radial-gradient(circle at 69% 42%, #12141a 0 3px, transparent 3.6px), var(--c-yellow); }
.ava::after { content: ""; position: absolute; left: 50%; top: 56%; width: 12px; height: 6px; margin-left: -8.5px; border: 2.5px solid #12141a; border-top: 0; border-radius: 0 0 12px 12px; }
.bub { flex: 1; min-width: 0; background: var(--surface); border: 2px solid var(--ink); border-radius: 4px 16px 16px 16px; padding: 9px 12px 10px; display: flex; flex-direction: column; gap: 7px; align-items: flex-start; }
.bub .bt { font-size: 18px; font-weight: 500; line-height: 1.4; }
.bub .bw { font-size: 15.5px; line-height: 1.4; border-radius: 10px; padding: 6px 10px; background: color-mix(in srgb, var(--c-yellow) 24%, var(--surface)); }
.askwhy, .hear { border: 0; border-radius: 999px; padding: 5px 13px; font-size: 14px; font-weight: 600; background: color-mix(in srgb, var(--c-yellow) 45%, var(--surface)); color: var(--ink); }
.hear { background: color-mix(in srgb, var(--accent) 16%, var(--surface)); }
.brow { display: flex; flex-wrap: wrap; gap: 6px; }
.oops { font-size: 15px; line-height: 1.4; font-weight: 500; border: 1.5px solid var(--c-orange); background: color-mix(in srgb, var(--c-orange) 13%, transparent); border-radius: 10px; padding: 6px 10px; }
.mission { font-family: var(--font-display); font-size: 17px; font-weight: 700; line-height: 1.2; }
.blockbox { position: sticky; top: 0; z-index: 2; font-size: 14px; line-height: 1.4; border: 1.5px solid var(--c-orange); background: color-mix(in srgb, var(--c-orange) 14%, var(--coachbg)); border-radius: 10px; padding: 7px 10px; }
.blockbox b.h { display: block; font-family: var(--font-display); font-size: 16px; }
.segs .oops { display: block; margin-top: 6px; font-size: 14px; font-weight: 500; color: var(--ink); border: 1.5px solid var(--c-orange); background: color-mix(in srgb, var(--c-orange) 13%, transparent); border-radius: 10px; padding: 6px 10px; }
/* chữ có quy ước: bấm vào để xem nghĩa và xem trên khối */
.term { all: unset; cursor: pointer; text-decoration: underline dotted; text-decoration-thickness: 1.5px; text-underline-offset: 3px; text-decoration-color: color-mix(in srgb, currentColor 55%, transparent); }
.term:active { color: var(--arrow); }
.legend { display: flex; flex-wrap: wrap; gap: 3px 14px; font-size: 12.5px; color: var(--muted); margin-top: 8px; }
.legend span { white-space: nowrap; }
.legend i { display: inline-block; width: 12px; height: 12px; margin-right: 5px; vertical-align: -2px; font-style: normal; }
.k-pink { border: 2.5px solid var(--arrow); border-radius: 3px; }
.k-ring { border: 2px solid #fff; border-radius: 50%; box-shadow: 0 0 0 1.5px #12141a, inset 0 0 0 1.5px #12141a; }
.k-arrow { color: var(--arrow); font-weight: 700; width: auto !important; height: auto !important; vertical-align: 0 !important; }
.glossbtn { position: absolute; left: 16px; bottom: 6px; border: 2px solid var(--ink); background: var(--surface); border-radius: 999px; padding: 5px 12px; font-size: 13px; font-weight: 600; }
.glossbtn.on { background: var(--ink); color: var(--bg); }
.gl { display: block; width: 100%; text-align: left; border: 1px solid var(--line); border-radius: 10px; padding: 7px 10px; background: var(--surface); font-size: 14px; line-height: 1.35; }
.gl b { font-weight: 600; }
.gl.on { border-color: var(--arrow); background: color-mix(in srgb, var(--arrow) 10%, var(--surface)); }
.glist { display: flex; flex-direction: column; gap: 5px; }

@media (min-width: 820px) {
  .work { flex-direction: row; gap: 8px; padding: 0 16px 16px; }
  .cubewrap { flex: 1 1 54%; min-width: 0; }
  .side { flex: 1 1 46%; min-width: 0; border: 1px solid var(--line); border-radius: 18px; background: var(--surface); overflow: hidden; }
  .coach { padding-top: 16px; --coachbg: var(--surface); }
  .pad { background: var(--surface); }
  .key i { font-size: 22px; }
  .key span { font-size: 12px; }
  .key { padding: 6px 0 7px; }
}
/* ---------- sao, gợi ý nhẹ, thu gọn, hiệu ứng ---------- */
.snd { border: 2px solid var(--line); background: transparent; border-radius: 999px; width: 34px; height: 34px; padding: 0; font-size: 16px; line-height: 1; flex: 0 0 auto; }

.bigpraise { font-size: 46px; line-height: 1; }
.bigstep { font-size: 19px; font-weight: 600; line-height: 1.4; border-left: 5px solid var(--arrow); padding: 6px 10px; margin: 0; border-radius: 0 10px 10px 0; background: color-mix(in srgb, var(--arrow) 7%, transparent); }
.bigstep.ill { margin: 0; padding: 6px 10px; }
.bigstep.plain { border-left-color: var(--c-green); background: color-mix(in srgb, var(--c-green) 9%, transparent); }
.sdots { display: flex; gap: 5px; }
.sdots span { flex: 1; height: 6px; border-radius: 3px; background: var(--line); }
.sdots span.ok { background: var(--ok); }
.sdots span.cur { background: var(--arrow); }
.btn.nudge { animation: nudge 1.2s ease-in-out infinite; }
@keyframes nudge { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.07); box-shadow: 0 0 0 4px color-mix(in srgb, var(--accent) 30%, transparent); } }
.score { font-size: 15px; font-weight: 600; }
.rec { display: inline-block; background: var(--arrow); color: #fff; border-radius: 8px; padding: 1px 8px; font-size: 13px; font-weight: 700; }
.soft { border: 2px dashed var(--arrow); border-radius: 12px; padding: 8px 10px; display: flex; flex-direction: column; gap: 3px; }
.soft b { font-family: var(--font-display); font-size: 17px; }

}
.rules { margin: 0; padding: 0; list-style: none; counter-reset: rule; display: flex; flex-direction: column; gap: 8px; }
.rules li { counter-increment: rule; display: grid; grid-template-columns: 30px 1fr; column-gap: 8px; font-size: 14px; line-height: 1.4; color: var(--muted); }
.rules li::before { content: counter(rule); grid-row: span 2; width: 26px; height: 26px; border-radius: 8px; background: var(--c-yellow); color: #12141a; font-family: var(--font-display); font-weight: 800; font-size: 16px; display: flex; align-items: center; justify-content: center; }
.rules b { color: var(--ink); font-size: 15px; }
.rulespanel { border-color: color-mix(in srgb, var(--c-yellow) 60%, var(--line)); }
.rulecard { border-radius: 12px; padding: 8px 12px; background: color-mix(in srgb, var(--c-yellow) 22%, var(--surface)); border: 1.5px solid color-mix(in srgb, var(--c-yellow) 70%, transparent); display: flex; flex-direction: column; gap: 2px; }

@media (prefers-reduced-motion: reduce) { .tile { transition: none; } .toast { transition: none; } .btn.nudge { animation: none; } }

<script>
/* Lõi khối rubik + bộ giải từng tầng (không dùng DOM) */
var Core = (function () {
  'use strict';

  // ---------- đại số nhỏ ----------
  function rotMat(axis, q) {
    q = ((q % 4) + 4) % 4;
    var c = [1, 0, -1, 0][q], s = [0, 1, 0, -1][q];
    if (axis === 0) return [1, 0, 0, 0, c, -s, 0, s, c];
    if (axis === 1) return [c, 0, s, 0, 1, 0, -s, 0, c];
    return [c, -s, 0, s, c, 0, 0, 0, 1];
  }
  function mmul(a, b) {
    var r = new Array(9);
    for (var i = 0; i < 3; i++) for (var j = 0; j < 3; j++)
      r[i * 3 + j] = a[i * 3] * b[j] + a[i * 3 + 1] * b[3 + j] + a[i * 3 + 2] * b[6 + j];
    return r;
  }
  function mvec(m, v) {
    return [m[0] * v[0] + m[1] * v[1] + m[2] * v[2], m[3] * v[0] + m[4] * v[1] + m[5] * v[2], m[6] * v[0] + m[7] * v[1] + m[8] * v[2]];
  }
  function mTvec(m, v) {
    return [m[0] * v[0] + m[3] * v[1] + m[6] * v[2], m[1] * v[0] + m[4] * v[1] + m[7] * v[2], m[2] * v[0] + m[5] * v[1] + m[8] * v[2]];
  }
  function meq(a, b) { for (var i = 0; i < 9; i++) if (a[i] !== b[i]) return false; return true; }
  function veq(a, b) { return a[0] === b[0] && a[1] === b[1] && a[2] === b[2]; }
  var I3 = [1, 0, 0, 0, 1, 0, 0, 0, 1];

  // ---------- khối ----------
  var HOMES = [];
  for (var x = -1; x <= 1; x++) for (var y = -1; y <= 1; y++) for (var z = -1; z <= 1; z++) HOMES.push([x, y, z]);
  function key(p) { return (p[0] + 1) * 9 + (p[1] + 1) * 3 + (p[2] + 1); }

  function newCube() {
    return { m: HOMES.map(function () { return I3.slice(); }), p: HOMES.map(function (h) { return h.slice(); }), at: HOMES.map(function (h, i) { return i; }), g: I3.slice() };
  }
  function clone(s) {
    return { m: s.m.map(function (a) { return a.slice(); }), p: s.p.map(function (a) { return a.slice(); }), at: s.at.slice(), g: s.g.slice() };
  }
  // [trục, lớp (null = cả khối), số phần tư vòng theo quy tắc bàn tay phải]
  var MOVES = {
    "R": [0, 1, -1], "R'": [0, 1, 1], "L": [0, -1, 1], "L'": [0, -1, -1],
    "U": [1, 1, -1], "U'": [1, 1, 1], "D": [1, -1, 1], "D'": [1, -1, -1],
    "F": [2, 1, -1], "F'": [2, 1, 1], "B": [2, -1, 1], "B'": [2, -1, -1],
    "y": [1, null, -1], "y'": [1, null, 1]
  };
  function inv(n) { return n.charAt(n.length - 1) === "'" ? n.slice(0, -1) : n + "'"; }
  function move(s, name) {
    var d = MOVES[name], ax = d[0], layer = d[1], R = rotMat(ax, d[2]);
    for (var i = 0; i < 27; i++) {
      if (layer === null || s.p[i][ax] === layer) { s.m[i] = mmul(R, s.m[i]); s.p[i] = mvec(R, s.p[i]); }
    }
    if (layer === null) s.g = mmul(R, s.g);
    for (i = 0; i < 27; i++) s.at[key(s.p[i])] = i;
    return s;
  }
  function apply(s, moves) { for (var i = 0; i < moves.length; i++) move(s, moves[i]); return s; }
  function run(s, moves) { return apply(clone(s), moves); }
  function parse(str) { return str.trim().split(/\s+/).filter(Boolean); }

  // màu: Y vàng (trên), W trắng (dưới), G lục (trước), B lam (sau), O cam (phải), R đỏ (trái)
  function dirColor(d) {
    if (d[1] === 1) return 'Y'; if (d[1] === -1) return 'W';
    if (d[2] === 1) return 'G'; if (d[2] === -1) return 'B';
    if (d[0] === 1) return 'O'; return 'R';
  }
  function colorAt(s, pos, dir) { var i = s.at[key(pos)]; return dirColor(mTvec(s.m[i], dir)); }
  function centerColor(s, dir) { return dirColor(mTvec(s.g, dir)); }

  var V = { U: [0, 1, 0], D: [0, -1, 0], F: [0, 0, 1], B: [0, 0, -1], R: [1, 0, 0], L: [-1, 0, 0] };
  function P(name) { var p = [0, 0, 0]; for (var i = 0; i < name.length; i++) { var v = V[name.charAt(i)]; p[0] += v[0]; p[1] += v[1]; p[2] += v[2]; } return p; }
  function C(s, posName, face) { return colorAt(s, P(posName), V[face]); }

  // nhóm viên theo vị trí gốc
  function homesWhere(fn) { var r = []; HOMES.forEach(function (h, i) { if (fn(h)) r.push(i); }); return r; }
  function nz(h) { return Math.abs(h[0]) + Math.abs(h[1]) + Math.abs(h[2]); }
  var G = {
    wEdges: homesWhere(function (h) { return h[1] === -1 && nz(h) === 2; }),
    wCorners: homesWhere(function (h) { return h[1] === -1 && nz(h) === 3; }),
    mEdges: homesWhere(function (h) { return h[1] === 0 && nz(h) === 2; }),
    yEdges: homesWhere(function (h) { return h[1] === 1 && nz(h) === 2; }),
    yCorners: homesWhere(function (h) { return h[1] === 1 && nz(h) === 3; }),
    centers: homesWhere(function (h) { return nz(h) === 1; }),
    all: homesWhere(function (h) { return nz(h) >= 2; })
  };
  function ok(s, i) { return meq(s.m[i], s.g); }
  function allOk(s, arr) { for (var k = 0; k < arr.length; k++) if (!ok(s, arr[k])) return false; return true; }

  // ---------- điều kiện xong từng chặng ----------
  function s1(s) { return allOk(s, G.wEdges); }
  function s2(s) { return s1(s) && allOk(s, G.wCorners); }
  function f2l(s) { return s2(s) && allOk(s, G.mEdges); }
  function yUp(s, i) { return veq(mvec(s.m[i], [0, 1, 0]), [0, 1, 0]); }
  function s4(s) { return f2l(s) && G.yEdges.every(function (i) { return yUp(s, i); }); }
  function s5(s) { return f2l(s) && allOk(s, G.yEdges); }
  function inPlace(s, i) { return veq(s.p[i], mvec(s.g, HOMES[i])); }
  function s6(s) { return s5(s) && G.yCorners.every(function (i) { return inPlace(s, i); }); }
  function solved(s) { return allOk(s, G.all); }
  function stageIndex(s) {
    if (!s1(s)) return 0; if (!s2(s)) return 1; if (!f2l(s)) return 2; if (!s4(s)) return 3;
    if (!s5(s)) return 4; if (!s6(s)) return 5; if (!solved(s)) return 6; return 7;
  }

  // ---------- công thức ----------
  var FORMULAS = {
    f1: { name: 'Thang máy', moves: parse("R U R' U'") },
    f3r: { name: 'Gửi sang phải', moves: parse("U R U' R' U' F' U F") },
    f3l: { name: 'Gửi sang trái', moves: parse("U' L' U L U F U' F'") },
    f4: { name: 'Chữ thập vàng', moves: parse("F R U R' U' F'") },
    f5: { name: 'Đổi cạnh', moves: parse("R U R' U R U U R'") },
    f6: { name: 'Đổi góc', moves: parse("U R U' L' U R' U' L") },
    f7: { name: 'Thang máy ngược', moves: parse("R' D' R D") }
  };
  function rep(arr, n) { var r = []; for (var i = 0; i < n; i++) r = r.concat(arr); return r; }

  var UOPT = [[], ['U'], ["U'"], ['U', 'U']];
  var YOPT = [[], ['y'], ["y'"], ['y', 'y']];
  var SIDES = ['F', 'R', 'B', 'L'];
  function firstOpt(s, opts, pred) {
    for (var k = 0; k < opts.length; k++) { var t = run(s, opts[k]); if (pred(t)) return { mv: opts[k], s: t }; }
    return null;
  }
  // t: lời nói cho bước này (câu lệnh trần: xoay gì, dừng khi nào). x.g: lời reo khi làm xong. x.w: lý do, chỉ hiện khi con bấm "Vì sao thế?". x.m: chỗ cần khoanh vòng tròn ('UFR' = một chỗ, 'UF:U' = một ô). x.h: mặt cần nhìn.
  function seg(t, moves, f, reps, x) {
    if (f && typeof f === 'object') { x = f; f = null; }
    x = x || {};
    return { t: t, moves: moves.slice(), f: f || null, reps: reps || 0, n: x.n || '', g: x.g || '', w: x.w || '', marks: x.m || [], hot: x.h || '' };
  }
  function mk(stage, id, title, segs, focus) {
    segs = segs.filter(function (g) { return g.moves.length > 0; });
    return { stage: stage, id: id, title: title, segs: segs, focus: focus || [] };
  }
  function cost(pl) { var n = 0; pl.segs.forEach(function (g) { n += g.moves.length; }); return n; }
  function best(list) { var b = null; list.forEach(function (p) { if (p && (!b || cost(p) < cost(b))) b = p; }); return b; }

  // ---------- chặng 1: chữ thập trắng (qua bông cúc) ----------
  function petalAt(s, slot) { return colorAt(s, P(slot), V.U) === 'W'; }
  function planCross(s) {
    var info = G.wEdges.map(function (i) {
      var w = mvec(s.m[i], [0, -1, 0]);
      return { i: i, w: w, petal: s.p[i][1] === 1 && w[1] === 1, done: ok(s, i) };
    });
    var pending = info.filter(function (e) { return !e.done && !e.petal; });
    if (pending.length === 0) {
      // thả từng cánh hoa xuống
      var cands = [];
      UOPT.forEach(function (u) {
        var t = run(s, u);
        SIDES.forEach(function (X) {
          var slot = 'U' + X;
          if (colorAt(t, P(slot), V.U) === 'W' && colorAt(t, P(slot), V[X]) === centerColor(t, V[X])) {
            var i = t.at[key(P(slot))];
            var yy = firstOpt(t, YOPT, function (q) { return veq(q.p[i], [0, 1, 1]); });
            cands.push(mk(1, 'c1-drop', 'Thả cánh hoa xuống đáy', [
              seg('Xoay tầng trên. Dừng khi cánh hoa viền hồng khớp màu.', u, { g: 'Khớp màu rồi.', w: 'Khớp màu là nó đang ở ngay trên nhà.' }),
              seg('Xoay cả khối. Đưa cánh hoa viền hồng về mặt trước.', yy.mv, { h: 'F', g: 'Cánh hoa ở mặt trước rồi.', w: 'Xoay cả khối chỉ để dễ nhìn. Không viên nào đổi chỗ.' }),
              seg('Xoay mặt trước 2 lần.', ['F', 'F'], { g: 'Cánh hoa về nhà rồi.', w: 'Xoay 2 lần là nửa vòng. Viên ở trên sẽ xuống đáy.' })
            ], [i]));
          }
        });
      });
      return best(cands);
    }
    var plans = pending.map(function (e) {
      var i = e.i, segs = [], t, id;
      function freeU(st, slot) {
        var o = firstOpt(st, UOPT, function (q) { return !petalAt(q, slot); });
        segs.push(seg('Xoay tầng trên. Dừng khi ô trong vòng tròn hết trắng.', o.mv, { g: 'Ô đó trống rồi.', w: 'Ô đó đang có một cánh hoa. Không xoay đi thì nó bị đẩy mất.', m: [slot + ':U'] }));
        return o.s;
      }
      function up(col, mv) { segs.push(seg('Đẩy cột ' + col + ' lên.', [mv], { g: 'Thêm một cánh hoa.', w: 'Ô trắng nằm ở cột ' + col + '. Cột đi lên thì nó lên theo.' })); }
      function side(col) { segs.push(seg('Xoay mặt trước ↻ 1 lần.', ['F'], { g: 'Ô trắng sang cột ' + col + ' rồi.', w: 'Ô trắng đang ở cột giữa. Cột giữa không đẩy lên được.' })); }
      if (e.w[1] === -1) {
        var yy = firstOpt(s, YOPT, function (q) { return veq(q.p[i], [0, -1, 1]); });
        segs.push(seg('Xoay cả khối. Đưa viên cạnh viền hồng về mặt trước.', yy.mv, { g: 'Viên cạnh ở mặt trước rồi.', w: 'Viên này ở đáy nhưng nhầm nhà. Mình đưa nó lên rồi làm lại.', h: 'F' }));
        t = freeU(yy.s, 'UF');
        segs.push(seg('Xoay mặt trước 2 lần.', ['F', 'F'], { g: 'Ô trắng lên mặt trên rồi.', w: 'Xoay 2 lần là nửa vòng. Viên ở đáy sẽ lên trên.' }));
        id = 'c1-d';
      } else {
        var y2 = firstOpt(s, YOPT, function (q) { return mvec(q.m[i], [0, -1, 0])[2] === 1; });
        segs.push(seg('Xoay cả khối. Đưa ô trắng viền hồng về mặt trước.', y2.mv, { h: 'F', g: 'Ô trắng ở mặt trước rồi.', w: 'Nhìn thẳng vào ô trắng mới biết nên đẩy cột nào.' }));
        t = y2.s;
        var p = t.p[i];
        if (p[0] === 1) {
          t = freeU(t, 'UR');
          up('phải', 'R');
          id = 'c1-fr';
        } else if (p[0] === -1) {
          t = freeU(t, 'UL');
          up('trái', "L'");
          id = 'c1-fl';
        } else if (p[1] === 1) {
          side('phải');
          t = run(t, ['F']);
          t = freeU(t, 'UR');
          up('phải', 'R');
          id = 'c1-uf';
        } else {
          t = freeU(t, 'UF');
          side('trái');
          t = run(t, ['F']);
          t = freeU(t, 'UL');
          up('trái', "L'");
          id = 'c1-df';
        }
      }
      return mk(1, id, 'Đưa ô trắng lên mặt trên', segs, [i]);
    });
    return best(plans);
  }

  // ---------- chặng 2: góc trắng ----------
  function planCorners(s) {
    var un = G.wCorners.filter(function (i) { return !ok(s, i); });
    var top = un.filter(function (i) { return s.p[i][1] === 1; });
    var f1 = FORMULAS.f1.moves;
    if (top.length) {
      return best(top.map(function (i) {
        var yy = firstOpt(s, YOPT, function (q) { return veq(mvec(q.g, HOMES[i]), [1, -1, 1]); });
        var uu = firstOpt(yy.s, UOPT, function (q) { return veq(q.p[i], [1, 1, 1]); });
        var t = uu.s, n = 0;
        while (!ok(t, i) && n < 6) { apply(t, f1); n++; }
        return mk(2, 'c2-top', 'Đưa viên góc trắng về nhà', [
          seg('Xoay cả khối. Dừng khi 2 ô trong vòng tròn giống màu viên góc.', yy.mv, { g: 'Nhà của viên góc đây rồi.', w: 'Nhà của viên góc nằm giữa 2 màu đó.', m: ['F:F', 'R:R'] }),
          seg('Xoay tầng trên. Đưa viên góc vào vòng tròn.', uu.mv, { g: 'Viên góc ở ngay trên nhà rồi.', w: 'Thang máy chỉ đưa được viên ở góc này xuống.', m: ['UFR'] }),
          seg('Làm Thang máy ' + n + ' lần.', rep(f1, n), 'f1', n, { g: 'Viên góc về nhà rồi.', w: 'Mỗi lần làm, viên góc xoay đi một chút. Lần này ' + n + ' lần thì ô trắng xuống đáy.' })
        ], [i]);
      }));
    }
    return best(un.map(function (i) {
      var yy = firstOpt(s, YOPT, function (q) { return veq(q.p[i], [1, -1, 1]); });
      var first = seg('Xoay cả khối. Đưa viên góc viền hồng vào vòng tròn.', yy.mv, { g: 'Vào vòng tròn rồi.', w: 'Thang máy chỉ làm được ở góc này.', m: ['DFR'] });
      if (inPlace(s, i)) {
        var t = clone(yy.s), n = 0;
        while (!ok(t, i) && n < 6) { apply(t, f1); n++; }
        return mk(2, 'c2-twist', 'Lật viên góc lại', [
          first,
          seg('Làm Thang máy ' + n + ' lần.', rep(f1, n), 'f1', n, { g: 'Ô trắng xuống đáy rồi.', w: 'Viên này đúng nhà nhưng ô trắng chưa xuống đáy. Thang máy lật nó lại.' })
        ], [i]);
      }
      return mk(2, 'c2-wrong', 'Đưa viên góc nhầm nhà lên tầng trên', [
        first,
        seg('Làm Thang máy 1 lần.', f1, 'f1', 1, { g: 'Viên góc lên tầng trên rồi.', w: 'Viên này nhầm nhà. Đưa nó lên trước, rồi mới đưa về nhà nó.' })
      ], [i]);
    }));
  }

  // ---------- chặng 3: tầng giữa ----------
  function planMiddle(s) {
    var un = G.mEdges.filter(function (i) { return !ok(s, i); });
    var top = un.filter(function (i) { return s.p[i][1] === 1; });
    if (top.length) {
      return best(top.map(function (i) {
        var h = HOMES[i], a = [h[0], 0, 0], b = [0, 0, h[2]];
        function sideHome(q) { return mvec(q.m[i], a)[1] === 1 ? b : a; }
        function topHome(q) { return mvec(q.m[i], a)[1] === 1 ? a : b; }
        var uu = firstOpt(s, UOPT, function (q) { var hs = sideHome(q); return veq(mvec(q.m[i], hs), mvec(q.g, hs)); });
        var yy = firstOpt(uu.s, YOPT, function (q) { return veq(q.p[i], [0, 1, 1]); });
        var right = mvec(yy.s.g, topHome(yy.s))[0] === 1, ben = right ? 'phải' : 'trái';
        return mk(3, right ? 'c3-right' : 'c3-left', 'Đưa viên cạnh vào tầng giữa', [
          seg('Xoay tầng trên. Dừng khi viên cạnh viền hồng khớp màu.', uu.mv, { g: 'Khớp màu rồi.', w: 'Khớp màu trước, rồi mới biết nó phải sang bên nào.' }),
          seg('Xoay cả khối. Đưa viên cạnh viền hồng về mặt trước.', yy.mv, { h: 'F', g: 'Viên cạnh ở mặt trước rồi.', w: 'Công thức Gửi làm từ mặt trước.' }),
          seg('Làm Gửi sang ' + ben + '.', right ? FORMULAS.f3r.moves : FORMULAS.f3l.moves, right ? 'f3r' : 'f3l', 1, { g: 'Viên cạnh vào tầng giữa rồi.', w: 'Ô phía trên của nó giống ô giữa bên ' + ben + '. Nhà nó ở bên ' + ben + '.' })
        ], [i]);
      }));
    }
    return best(un.map(function (i) {
      var yy = firstOpt(s, YOPT, function (q) { return veq(q.p[i], [1, 0, 1]); });
      return mk(3, 'c3-stuck', 'Đưa viên cạnh kẹt lên tầng trên', [
        seg('Xoay cả khối. Đưa viên cạnh viền hồng vào vòng tròn.', yy.mv, { g: 'Vào vòng tròn rồi.', w: 'Gửi sang phải làm được ở chỗ này.', m: ['FR'] }),
        seg('Làm Gửi sang phải 1 lần.', FORMULAS.f3r.moves, 'f3r', 1, { g: 'Viên kẹt lên tầng trên rồi.', w: 'Một viên khác vào chỗ đó, viên kẹt bị đẩy lên.' })
      ], [i]);
    }));
  }

  // ---------- chặng 4: chữ thập vàng ----------
  function planYCross(s) {
    function up(q, X) { return colorAt(q, P('U' + X), V.U) === 'Y'; }
    var n = SIDES.filter(function (X) { return up(s, X); }).length;
    var f = FORMULAS.f4.moves, fs = function (g) { return seg('Làm công thức Chữ thập vàng.', f, 'f4', 1, { g: g, w: 'Mỗi lần làm, hình vàng lớn thêm: chấm, chữ L, vạch, rồi chữ thập.' }); };
    if (n === 0) return mk(4, 'c4-dot', 'Chấm vàng thành chữ L', [fs('Chấm thành chữ L rồi.')]);
    var ups = G.yEdges.filter(function (i) { return yUp(s, i); });
    if (n === 2) {
      if ((up(s, 'F') && up(s, 'B')) || (up(s, 'L') && up(s, 'R'))) {
        var o = firstOpt(s, UOPT, function (q) { return up(q, 'L') && up(q, 'R'); });
        return mk(4, 'c4-line', 'Vạch vàng thành chữ thập', [seg('Xoay tầng trên. Cho vạch vàng nằm ngang.', o.mv, { g: 'Vạch nằm ngang rồi.', w: 'Vạch nằm ngang thì công thức mới ra chữ thập.', m: ['UL:U', 'UR:U'] }), fs('Có chữ thập vàng rồi.')], ups);
      }
      var o2 = firstOpt(s, UOPT, function (q) { return up(q, 'B') && up(q, 'L'); });
      return mk(4, 'c4-L', 'Chữ L thành vạch vàng', [seg('Xoay tầng trên. Đưa 2 ô vàng viền hồng vào 2 vòng tròn.', o2.mv, { g: 'Chữ L vào đúng góc rồi.', w: 'Chữ L nằm ở góc đó thì công thức mới ra vạch.', m: ['UB:U', 'UL:U'] }), fs('Chữ L thành vạch rồi.')], ups);
    }
    return null;
  }

  // ---------- chặng 5: cạnh vàng về đúng mặt ----------
  function matches(q) { return SIDES.filter(function (X) { return colorAt(q, P('U' + X), V[X]) === centerColor(q, V[X]); }); }
  function planYEdges(s) {
    var four = firstOpt(s, UOPT, function (q) { return matches(q).length === 4; });
    if (four) return mk(5, 'c5-turn', 'Chỉ cần xoay tầng trên', [seg('Xoay tầng trên. Dừng khi cả 4 viên cạnh vàng khớp màu.', four.mv, { g: 'Khớp cả 4 rồi.', w: '4 viên đã đúng thứ tự, chỉ lệch một chút.' })]);
    var f = FORMULAS.f5.moves;
    function adjacent(m) { return !((m[0] === 'F' && m[1] === 'B') || (m[0] === 'R' && m[1] === 'L')); }
    function pair(q) { return matches(q).map(function (X) { return q.at[key(P('U' + X))]; }); }
    function first(mv) { return seg('Xoay tầng trên. Dừng khi 2 viên cạnh viền hồng khớp màu.', mv, { g: 'Hai viên khớp màu rồi.', w: 'Hai viên này xong rồi. Còn phải đổi chỗ 2 viên kia.' }); }
    var adj = firstOpt(s, UOPT, function (q) { var m = matches(q); return m.length === 2 && adjacent(m); });
    if (adj) {
      var yy = firstOpt(adj.s, YOPT, function (q) { var m = matches(q); return m.indexOf('B') >= 0 && m.indexOf('R') >= 0; });
      return mk(5, 'c5-adj', 'Đổi chỗ 2 viên cạnh chưa khớp', [
        first(adj.mv),
        seg('Xoay cả khối. Đưa 2 viên cạnh viền hồng vào 2 vòng tròn.', yy.mv, { g: 'Hai viên vào vòng tròn rồi.', w: 'Đổi cạnh không đụng tới 2 chỗ đó.', m: ['UB', 'UR'] }),
        seg('Làm Đổi cạnh.', f, 'f5', 1, { g: 'Hai viên kia đổi chỗ rồi.', w: 'Đổi cạnh chỉ đổi chỗ 2 viên chưa khớp.' })
      ], pair(adj.s));
    }
    var opp = firstOpt(s, UOPT, function (q) { return matches(q).length === 2; });
    if (!opp) return null;
    return mk(5, 'c5-opp', 'Hai viên khớp màu nằm đối diện', [
      first(opp.mv),
      seg('Làm Đổi cạnh 1 lần.', f, 'f5', 1, { g: 'Hai viên khớp màu kề nhau rồi.', w: 'Đối diện thì chưa đổi chỗ được. Làm 1 lần cho 2 viên kề nhau trước.' })
    ], pair(opp.s));
  }

  // ---------- chặng 6: góc vàng về đúng ô ----------
  function planYCorners(s) {
    var good = G.yCorners.filter(function (i) { return inPlace(s, i); });
    var f = FORMULAS.f6.moves;
    if (good.length >= 1 && good.length < 4) {
      var i = good[0];
      var yy = firstOpt(s, YOPT, function (q) { return veq(q.p[i], [1, 1, 1]); });
      return mk(6, 'c6-one', 'Đổi chỗ 3 viên góc', [
        seg('Xoay cả khối. Đưa viên góc viền hồng vào vòng tròn.', yy.mv, { g: 'Viên này sẽ ở yên đây.', w: 'Viên này về nhà rồi. Đổi góc không đụng tới góc này.', m: ['UFR'] }),
        seg('Làm Đổi góc.', f, 'f6', 1, { g: 'Ba viên kia đổi chỗ rồi.', w: 'Ba viên đổi chỗ xoay vòng. Chưa về nhà thì làm thêm 1 lần.' })
      ], [i]);
    }
    return mk(6, 'c6-none', 'Cho một viên góc về nhà trước', [seg('Làm Đổi góc 1 lần.', f, 'f6', 1, { g: 'Có một viên góc về nhà rồi.', w: 'Cần 1 viên về nhà trước. 3 viên còn lại mới đổi chỗ được.' })]);
  }

  // ---------- chặng 7: xoay góc vàng ----------
  function loose6(s) {
    if (!f2l(s)) return -1;
    for (var b = 0; b < 4; b++) { if (s6(run(s, UOPT[b]))) return b; }
    return -1;
  }
  function detect7(s) {
    var f = FORMULAS.f7.moves;
    for (var p = 0; p < 4; p++) {
      var t = clone(s);
      for (var k = p - 1; k >= 0; k--) move(t, inv(f[k]));
      for (var m = 0; m < 6; m++) {
        if (p === 0 && m === 0) continue;
        if (loose6(run(t, rep(f, (6 - m) % 6))) >= 0) return { p: p, m: m };
      }
    }
    return null;
  }
  function ufrUp(q) { return colorAt(q, [1, 1, 1], V.U) === 'Y'; }
  function allUp(q) { return ['UFR', 'UFL', 'UBR', 'UBL'].every(function (c) { return colorAt(q, P(c), V.U) === 'Y'; }); }
  function plan7(s, det) {
    var f = FORMULAS.f7.moves, segs = [], t = clone(s), title = 'Lật ô vàng lên trên';
    if (det.p > 0) {
      var restMoves = f.slice(det.p);
      segs.push(seg('Làm nốt Thang máy ngược.', restMoves, 'f7', 0, { g: 'Đủ một lần rồi.', w: 'Bỏ dở thì tầng dưới không về như cũ được.' }));
      apply(t, restMoves);
    }
    if (!ufrUp(t)) {
      var n = 0;
      while (!ufrUp(t) && n < 6) { apply(t, f); n++; }
      segs.push(seg('Làm Thang máy ngược ' + n + ' lần.', rep(f, n), 'f7', n, { g: 'Ô vàng lên trên rồi.', w: 'Tầng dưới rối là đúng. Lật xong viên góc cuối, nó tự về như cũ.' }));
      return mk(7, 'c7-twist', title, segs, [s.at[key([1, 1, 1])]]);
    }
    if (segs.length) return mk(7, 'c7-twist', title, segs);
    if (allUp(t)) {
      var a = firstOpt(t, UOPT, solved);
      if (!a) return null;
      return mk(7, 'c7-align', 'Bước cuối cùng', [seg('Xoay tầng trên. Dừng khi 6 mặt đúng màu.', a.mv, { g: 'Xong cả khối rồi!', w: 'Tầng trên đúng hết rồi, chỉ lệch một chút.' })]);
    }
    var o = firstOpt(t, [['U'], ["U'"], ['U', 'U']], function (q) { return !ufrUp(q); });
    return mk(7, 'c7-next', 'Sang viên góc tiếp theo', [
      seg('Xoay tầng trên, đưa viên góc viền hồng vào vòng tròn. Không xoay cả khối.', o.mv, { g: 'Viên tiếp theo vào vòng tròn rồi.', w: 'Xoay cả khối thì tầng dưới không về như cũ được.', m: ['UFR'] })
    ], [o.s.at[key([1, 1, 1])]]);
  }

  // ---------- đếm tiến độ trong từng chặng ----------
  function counts(s) {
    var petals = 0; G.wEdges.forEach(function (i) { if (s.p[i][1] === 1 && mvec(s.m[i], [0, -1, 0])[1] === 1) petals++; });
    function n(arr, fn) { return arr.filter(function (i) { return fn(s, i); }).length; }
    var em = 0; for (var b = 0; b < 4; b++) em = Math.max(em, matches(run(s, UOPT[b])).length);
    var cu = ['UFR', 'UFL', 'UBR', 'UBL'].filter(function (q) { return colorAt(s, P(q), V.U) === 'Y'; }).length;
    function down(q, i) { return q.p[i][1] === -1 && mvec(q.m[i], [0, -1, 0])[1] === -1; }
    return { wd: n(G.wEdges, down), wcd: n(G.wCorners, down), petals: petals, cross: n(G.wEdges, ok), wc: n(G.wCorners, ok), me: n(G.mEdges, ok), yu: n(G.yEdges, yUp), ye: em, yc: n(G.yCorners, inPlace), cu: cu };
  }

  // ---------- bộ lập kế hoạch chính ----------
  function plan(s, ctx) {
    if (solved(s)) return null;
    if (f2l(s)) {
      if (ctx && ctx.last7 && loose6(s) >= 0) return plan7(s, { p: 0, m: 0 });
      if (!s4(s)) return planYCross(s);
      if (!s5(s)) return planYEdges(s);
      if (!s6(s)) return planYCorners(s);
      return plan7(s, { p: 0, m: 0 });
    }
    var d = detect7(s);
    if (d) return plan7(s, d);
    if (!s1(s)) return planCross(s);
    if (!s2(s)) return planCorners(s);
    return planMiddle(s);
  }
  function planMoves(pl) { var r = []; pl.segs.forEach(function (g) { r = r.concat(g.moves); }); return r; }

  // ---------- xáo trộn và tạo tình huống ----------
  var FACE = ['R', "R'", 'L', "L'", 'U', "U'", 'D', "D'", 'F', "F'", 'B', "B'"];
  function scramble(rnd, n) {
    rnd = rnd || Math.random; n = n || 25;
    var out = [], last = '';
    while (out.length < n) {
      var mv = FACE[Math.floor(rnd() * 12)];
      if (mv.charAt(0) === last) continue;
      last = mv.charAt(0); out.push(mv);
    }
    return out;
  }
  // giải đến hết chặng k (k = 0..7); trả về số bước, hoặc -1 nếu lỗi
  function solveTo(s, k, onPlan) {
    var guard = 0, total = 0, ctx = { last7: false };
    while (stageIndex(s) < k) {
      var pl = plan(s, ctx);
      if (!pl || ++guard > 300) return -1;
      if (onPlan && onPlan(pl, s) === false) return total;
      var mv = planMoves(pl);
      if (!mv.length) return -1;
      apply(s, mv); total += mv.length; ctx.last7 = pl.stage === 7;
    }
    return total;
  }
  // khối đã xong các chặng trước k, đang ở chặng k
  function stageStart(k, rnd) {
    for (var tries = 0; tries < 400; tries++) {
      var s = apply(newCube(), scramble(rnd));
      if (solveTo(s, k - 1) < 0) continue;
      if (stageIndex(s) === k - 1) { var pl = plan(s); if (pl && pl.stage === k) return s; }
    }
    return null;
  }
  // khối đang gặp đúng tình huống caseId của chặng k
  function findCase(k, caseId, rnd) {
    for (var tries = 0; tries < 600; tries++) {
      var s = stageStart(k, rnd); if (!s) continue;
      var hit = null, ctx = { last7: false }, guard = 0;
      while (stageIndex(s) < k && guard++ < 80) {
        var pl = plan(s, ctx); if (!pl) break;
        if (pl.id === caseId) { hit = s; break; }
        apply(s, planMoves(pl)); ctx.last7 = pl.stage === 7;
      }
      if (hit) return hit;
    }
    return null;
  }

  return {
    HOMES: HOMES, MOVES: MOVES, FORMULAS: FORMULAS, G: G, V: V, pos: P,
    newCube: newCube, clone: clone, move: move, apply: apply, run: run, inv: inv, parse: parse, rotMat: rotMat,
    mmul: mmul, mvec: mvec, mTvec: mTvec, dirColor: dirColor, colorAt: colorAt, centerColor: centerColor, key: key,
    stageIndex: stageIndex, solved: solved, plan: plan, planMoves: planMoves, counts: counts,
    scramble: scramble, solveTo: solveTo, stageStart: stageStart, findCase: findCase
  };
})();

</script>
<script>
(function () {
  'use strict';
